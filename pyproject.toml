[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "WDS - Acervo de Conhecimento"
version = "0.1.0"
description = "Acervo pessoal de conhecimento"
requires-python = ">=3.14"
dependencies = [
    "chromadb",
    "customtkinter>=5.2,<6",
    "sentence-transformers",
]

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
where = ["src"]
