[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "wds"
version = "0.1.0"
description = "Repositório pessoal de conhecimento"
requires-python = ">=3.14"
dependencies = [
    "chromadb",
    "customtkinter>=5.2,<6",
    "pypdf",
    "openpyxl",
    "python-docx",
    "sentence-transformers",
]

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
where = ["src"]
